[project]
name = "integrated-app"
version = "0.1.0"
description = "Modulo final del mi magnifico proyecto de Python Workshop"
authors = [
    { name = "ErPepinoMarino", email = "50591360+ErPepinoMarino@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "background-jobs",
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "pyfiglet>=1.0.4",
    "redis>=5.3.1",
    "rich>=15.0.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = "background_jobs.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "asyncpg"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyfiglet"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
    "ignore:Call to deprecated close:DeprecationWarning:arq.worker",
]

[tool.ruff]
src = ["src"]
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["integrated_app", "background_jobs"]

[tool.uv.sources]
background-jobs = { path = "../04_background_jobs", editable = true }

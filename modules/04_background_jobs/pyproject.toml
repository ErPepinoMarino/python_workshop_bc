[project]
name = "background-jobs"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "ErPepinoMarino", email = "50591360+ErPepinoMarino@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "arq>=0.28.0",
    "pydantic-settings>=2.16.3",
    "redis>=5.3.1",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["background_jobs"]
